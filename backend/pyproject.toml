[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:locust"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


[tool.coverage.run]
concurrency = ["thread", "greenlet"]
source = ["app.services"]

[tool.coverage.report]
fail_under = 80
show_missing = true
