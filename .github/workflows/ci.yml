name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: ruff check ../scripts --config pyproject.toml
      - run: python ../scripts/generate_contract_types.py --check
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://api.example.com/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  database-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, tidb]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --report /tmp/schema-report.json
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite auth --report /tmp/auth-report.xml
      - uses: actions/upload-artifact@v4
        with:
          name: database-checks-${{ matrix.engine }}
          path: |
            /tmp/schema-report.json
            /tmp/auth-report.xml
