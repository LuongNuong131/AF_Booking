name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: ""
      DATABASE_SSL_CA: ""
      DB_SSL: ""
      DATABASE_SSL: ""
      SENTRY_DSN: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: ruff check ../scripts --config pyproject.toml
      - run: python ../scripts/generate_contract_types.py --check
      - run: pip-audit --disable-pip --no-deps -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Service coverage on real TLS MySQL
        run: |
          mkdir -p /tmp/coverage-data
          python tests/run_schema_checks.py --engine mysql --suite coverage --report /tmp/service-coverage.xml
        env:
          COVERAGE_FILE: /tmp/coverage-data/.coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-coverage
          path: |
            /tmp/service-coverage.xml
            /tmp/service-coverage.coverage.xml
            /tmp/service-coverage.coverage.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: https://api.example.com/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:security
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
  database-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, tidb]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --report /tmp/schema-report.json
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite auth --report /tmp/auth-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite booking --report /tmp/booking-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite tasks --report /tmp/tasks-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite admin --report /tmp/admin-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite operations --report /tmp/operations-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite backup --report /tmp/backup-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite observability --report /tmp/observability-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite security --report /tmp/security-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite invoices --report /tmp/invoices-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite collaboration --report /tmp/collaboration-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite safeguards --report /tmp/safeguards-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite integrity-performance --report /tmp/integrity-performance.json
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite realtime --report /tmp/realtime-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite folder --report /tmp/folder-report.xml
      - run: python tests/run_schema_checks.py --engine ${{ matrix.engine }} --suite search-performance --report /tmp/search-performance.json
      - uses: actions/upload-artifact@v4
        with:
          name: database-checks-${{ matrix.engine }}
          path: |
            /tmp/schema-report.json
            /tmp/auth-report.xml
            /tmp/booking-report.xml
            /tmp/tasks-report.xml
            /tmp/admin-report.xml
            /tmp/safeguards-report.xml
            /tmp/collaboration-report.xml
            /tmp/operations-report.xml
            /tmp/security-report.xml
            /tmp/backup-report.xml
            /tmp/observability-report.xml
            /tmp/invoices-report.xml
            /tmp/invoices-report.plans.json
            /tmp/integrity-performance.json
            /tmp/realtime-report.xml
            /tmp/folder-report.xml
            /tmp/search-performance.json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python backend/tests/run_schema_checks.py --engine tidb --suite frontend --report /tmp/browser.xml
        env:
          BOOKING_E2E_ARTIFACTS: /tmp/booking-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            /tmp/browser.xml
            /tmp/booking-browser
