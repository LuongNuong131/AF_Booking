services:
  - type: web
    name: booking-tracker-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --require-hashes -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: BUSINESS_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "280"
